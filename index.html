<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHACAL BRASIL - Player</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px 0;
            position: relative;
        }

        /* EFEITO NEON DE FUNDO (PHACAL REPETIDO) */
        .neon-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            opacity: 0.15;
        }

        .neon-track {
            display: flex;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #0a84ff;
            text-shadow: 0 0 8px rgba(10, 132, 255, 0.8), 0 0 20px rgba(10, 132, 255, 0.4);
            animation: marquee 25s linear infinite;
            margin-bottom: 25px;
        }

        .neon-track span {
            margin-right: 30px;
        }

        .neon-track:nth-child(even) {
            animation-direction: reverse;
            animation-duration: 30s;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }

        /* CONTEÚDO DO PLAYER ACIMA DO FUNDO */
        .player-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .artwork-container {
            width: 210px;
            height: 210px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.8);
            margin-bottom: 18px;
            background-color: #1c1c1e;
        }

        .artwork-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-info {
            width: 100%;
            margin-bottom: 18px;
        }

        .track-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 15px;
            color: #8e8e93;
        }

        .progress-container {
            width: 100%;
            margin-bottom: 18px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #3a3a3c;
            border-radius: 3px;
            appearance: none;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #8e8e93;
            margin-top: 6px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-bottom: 18px;
        }

        .btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            font-size: 22px;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.9);
        }

        .btn-play {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.25);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-play:active {
            transform: scale(0.92);
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.2);
        }

        /* CONTROLO DE VOLUME HORIZONTAL */
        .volume-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 18px;
            width: 100%;
            background: rgba(28, 28, 30, 0.6);
            padding: 10px 15px;
            border-radius: 14px;
            border: 1px solid #3a3a3c;
        }

        .volume-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 12px;
            color: #8e8e93;
            margin-bottom: 6px;
        }

        .volume-slider-horizontal {
            appearance: none;
            width: 100%;
            height: 6px;
            background: #3a3a3c;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider-horizontal::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
        }

        /* BOTÕES DE EFEITOS */
        .effects-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            width: 100%;
            flex-wrap: wrap;
        }

        .effect-btn {
            background-color: #1c1c1e;
            border: 1px solid #3a3a3c;
            color: #ffffff;
            padding: 7px 12px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .effect-btn.active {
            background-color: #0a84ff;
            border-color: #0a84ff;
            box-shadow: 0 0 12px rgba(10, 132, 255, 0.5);
            font-weight: bold;
        }

        .equalizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 20px;
            margin-top: 12px;
        }

        .bar {
            width: 4px;
            background-color: #8e8e93;
            border-radius: 2px;
            height: 4px;
            transition: height 0.2s ease;
        }

        .playing .bar {
            animation: bounce 0.8s infinite alternate;
        }

        .playing .bar:nth-child(2) { animation-delay: 0.2s; }
        .playing .bar:nth-child(3) { animation-delay: 0.4s; }
        .playing .bar:nth-child(4) { animation-delay: 0.1s; }

        @keyframes bounce {
            0% { height: 4px; }
            100% { height: 18px; background-color: #0a84ff; }
        }
    </style>
</head>
<body>

    <div class="neon-background">
        <div class="neon-track">
            <span>PHACAL</span><span>PHACAL BRASIL</span><span>PHACAL</span><span>PHACAL BRASIL</span><span>PHACAL</span><span>PHACAL BRASIL</span><span>PHACAL</span><span>PHACAL BRASIL</span>
        </div>
        <div class="neon-track">
            <span>BRASIL</span><span>PHACAL</span><span>BRASIL</span><span>PHACAL</span><span>BRASIL</span><span>PHACAL</span><span>BRASIL</span><span>PHACAL</span>
        </div>
        <div class="neon-track">
            <span>PHACAL</span><span>PHACAL BRASIL</span><span>PHACAL</span><span>PHACAL BRASIL</span><span>PHACAL</span><span>PHACAL BRASIL</span><span>PHACAL</span><span>PHACAL BRASIL</span>
        </div>
        <div class="neon-track">
            <span>BRASIL</span><span>PHACAL</span><span>BRASIL</span><span>PHACAL</span><span>BRASIL</span><span>PHACAL</span><span>BRASIL</span><span>PHACAL</span>
        </div>
    </div>

    <div class="player-container" id="playerContainer">
        <div class="artwork-container">
            <img id="albumArt" src="capa1.jpeg" alt="Capa do Álbum">
        </div>

        <div class="track-info">
            <div class="track-title" id="trackTitle">Musica 1</div>
            <div class="track-artist" id="trackArtist">PHACAL BRASIL</div>
        </div>

        <div class="progress-container">
            <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100">
            <div class="time-info">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="prevBtn">⏮</button>
            <button class="btn btn-play" id="playBtn">&#9658;</button>
            <button class="btn" id="nextBtn">⏭</button>
        </div>

        <div class="volume-section">
            <div class="volume-header">
                <span>Volume</span>
                <span id="volumeValue">100%</span>
            </div>
            <input type="range" id="volumeSlider" class="volume-slider-horizontal" min="0" max="1" step="0.01" value="1">
        </div>

        <div class="effects-container">
            <button class="effect-btn active" data-effect="normal">Normal</button>
            <button class="effect-btn" data-effect="bass">Grave Forte</button>
            <button class="effect-btn" data-effect="muffled">Abafado</button>
            <button class="effect-btn" data-effect="nineD">Áudio 9D</button>
        </div>

        <div class="equalizer" id="equalizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </div>

    <audio id="audioPlayer" crossorigin="anonymous"></audio>

    <script>
        const playlist = [
            { title: "Musica 1", artist: "PHACAL BRASIL", src: "musica1.mp3", cover: "capa1.jpeg" },
            { title: "Musica 2", artist: "PHACAL BRASIL", src: "musica2.mp3", cover: "capa2.jpeg" },
            { title: "Musica 3", artist: "PHACAL BRASIL", src: "musica3.mp3", cover: "capa3.jpeg" },
            { title: "Musica 4", artist: "PHACAL BRASIL", src: "musica4.mp3", cover: "capa4.jpeg" }
        ];

        let currentTrack = 0;
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const albumArt = document.getElementById('albumArt');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const playerContainer = document.getElementById('playerContainer');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const effectBtns = document.querySelectorAll('.effect-btn');

        let audioCtx, sourceNode, gainNode, bassFilter, trebleFilter, pannerNode;
        let pannerInterval = null;

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                sourceNode = audioCtx.createMediaElementSource(audio);

                gainNode = audioCtx.createGain();
                bassFilter = audioCtx.createBiquadFilter();
                trebleFilter = audioCtx.createBiquadFilter();
                pannerNode = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;

                bassFilter.type = 'lowshelf';
                bassFilter.frequency.setValueAtTime(200, audioCtx.currentTime);
                bassFilter.gain.setValueAtTime(0, audioCtx.currentTime);

                trebleFilter.type = 'highshelf';
                trebleFilter.frequency.setValueAtTime(3000, audioCtx.currentTime);
                trebleFilter.gain.setValueAtTime(0, audioCtx.currentTime);

                let lastNode = sourceNode;
                lastNode.connect(bassFilter);
                bassFilter.connect(trebleFilter);
                
                if (pannerNode) {
                    trebleFilter.connect(pannerNode);
                    pannerNode.connect(gainNode);
                } else {
                    trebleFilter.connect(gainNode);
                }
                
                gainNode.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function loadTrack(index) {
            const track = playlist[index];
            audio.src = track.src;
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            albumArt.src = track.cover;
            audio.load();
        }

        function playTrack() {
            initAudioContext();
            audio.play();
            playBtn.innerHTML = "&#10074;&#10074;";
            playerContainer.classList.add('playing');
        }

        function pauseTrack() {
            audio.pause();
            playBtn.innerHTML = "&#9658;";
            playerContainer.classList.remove('playing');
        }

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                playTrack();
            } else {
                pauseTrack();
            }
        });

        nextBtn.addEventListener('click', () => {
            currentTrack = (currentTrack + 1) % playlist.length;
            loadTrack(currentTrack);
            playTrack();
        });

        prevBtn.addEventListener('click', () => {
            currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrack);
            playTrack();
        });

        volumeSlider.addEventListener('input', () => {
            initAudioContext();
            gainNode.gain.setValueAtTime(volumeSlider.value, audioCtx.currentTime);
            volumeValue.textContent = Math.round(volumeSlider.value * 100) + '%';
        });

        effectBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                initAudioContext();
                effectBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const effect = btn.getAttribute('data-effect');
                
                if (pannerInterval) {
                    clearInterval(pannerInterval);
                    pannerInterval = null;
                }
                if (pannerNode) {
                    pannerNode.pan.setValueAtTime(0, audioCtx.currentTime);
                }

                if (effect === 'normal') {
                    bassFilter.gain.setValueAtTime(0, audioCtx.currentTime);
                    trebleFilter.gain.setValueAtTime(0, audioCtx.currentTime);
                } 
                else if (effect === 'bass') {
                    bassFilter.gain.setValueAtTime(15, audioCtx.currentTime);
                    trebleFilter.gain.setValueAtTime(-2, audioCtx.currentTime);
                } 
                else if (effect === 'muffled') {
                    bassFilter.gain.setValueAtTime(5, audioCtx.currentTime);
                    trebleFilter.gain.setValueAtTime(-25, audioCtx.currentTime);
                } 
                else if (effect === 'nineD') {
                    bassFilter.gain.setValueAtTime(5, audioCtx.currentTime);
                    trebleFilter.gain.setValueAtTime(0, audioCtx.currentTime);
                    
                    if (pannerNode) {
                        let angle = 0;
                        pannerInterval = setInterval(() => {
                            angle += 0.05;
                            pannerNode.pan.setValueAtTime(Math.sin(angle), audioCtx.currentTime);
                        }, 50);
                    }
                }
            });
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                durationEl.textContent = formatTime(audio.duration);
            }
        });

        progressBar.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
        });

        audio.addEventListener('ended', () => {
            nextBtn.click();
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        loadTrack(currentTrack);
    </script>
</body>
</html>
