<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHACAL BRASIL - Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .player-container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .artwork-container {
            width: 280px;
            height: 280px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            margin-bottom: 30px;
            background-color: #1c1c1e;
        }

        .artwork-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-info {
            width: 100%;
            margin-bottom: 25px;
        }

        .track-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 16px;
            color: #8e8e93;
        }

        .progress-container {
            width: 100%;
            margin-bottom: 25px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #3a3a3c;
            border-radius: 3px;
            appearance: none;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #8e8e93;
            margin-top: 8px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            font-size: 24px;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.9);
        }

        .btn-play {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .equalizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 24px;
        }

        .bar {
            width: 4px;
            background-color: #8e8e93;
            border-radius: 2px;
            height: 4px;
            transition: height 0.2s ease;
        }

        .playing .bar {
            animation: bounce 0.8s infinite alternate;
        }

        .playing .bar:nth-child(2) { animation-delay: 0.2s; }
        .playing .bar:nth-child(3) { animation-delay: 0.4s; }
        .playing .bar:nth-child(4) { animation-delay: 0.1s; }

        @keyframes bounce {
            0% { height: 4px; }
            100% { height: 20px; background-color: #0a84ff; }
        }
    </style>
</head>
<body>

    <div class="player-container" id="playerContainer">
        <div class="artwork-container">
            <img id="albumArt" src="capa1.jpeg" alt="Capa do Álbum">
        </div>

        <div class="track-info">
            <div class="track-title" id="trackTitle">Nome da Musica</div>
            <div class="track-artist" id="trackArtist">PHACAL BRASIL</div>
        </div>

        <div class="progress-container">
            <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100">
            <div class="time-info">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="prevBtn">⏮</button>
            <button class="btn btn-play" id="playBtn">▶</button>
            <button class="btn" id="nextBtn">⏭</button>
        </div>

        <div class="equalizer" id="equalizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // LISTA DE MÚSICAS (Nomes exatos na mesma pasta, sem acentos!)
        const playlist = [
            {
                title: "Musica 1",
                artist: "PHACAL BRASIL",
                src: "musica1.mp3",
                cover: "capa1.jpeg"
            },
            {
                title: "Musica 2",
                artist: "PHACAL BRASIL",
                src: "musica2.mp3",
                cover: "capa2.jpeg"
            },
            {
                title: "Musica 3",
                artist: "PHACAL BRASIL",
                src: "musica3.mp3",
                cover: "capa3.jpeg"
            },
            {
                title: "Musica 4",
                artist: "PHACAL BRASIL",
                src: "musica4.mp3",
                cover: "capa4.jpeg"
            }
        ];

        let currentTrack = 0;
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const albumArt = document.getElementById('albumArt');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const playerContainer = document.getElementById('playerContainer');

        function loadTrack(index) {
            const track = playlist[index];
            audio.src = track.src;
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            albumArt.src = track.cover;
            audio.load();
        }

        function playTrack() {
            audio.play();
            playBtn.textContent = "⏸";
            playerContainer.classList.add('playing');
        }

        function pauseTrack() {
            audio.pause();
            playBtn.textContent = "▶";
            playerContainer.classList.remove('playing');
        }

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                playTrack();
            } else {
                pauseTrack();
            }
        });

        nextBtn.addEventListener('click', () => {
            currentTrack = (currentTrack + 1) % playlist.length;
            loadTrack(currentTrack);
            playTrack();
        });

        prevBtn.addEventListener('click', () => {
            currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrack);
            playTrack();
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                durationEl.textContent = formatTime(audio.duration);
            }
        });

        progressBar.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
        });

        audio.addEventListener('ended', () => {
            nextBtn.click();
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Inicializar a primeira faixa
        loadTrack(currentTrack);
    </script>
</body>
</html>
